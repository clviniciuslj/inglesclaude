# SDK usado pelos testes Robolectric do app.
# O SDK 36 (Android 16) falha no JDK 21: o Robolectric chama ApplicationSharedMemory.create, que
# precisa de jdk.internal.access ("module java.base does not export jdk.internal.access").
# Os testes de banco não dependem de comportamento do Android 16, então usamos o SDK 35.
sdk=35
